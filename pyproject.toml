[tool.uv.workspace]
members = ["mycode", "cli"]

[tool.uv.sources]
mycode-sdk = { workspace = true }
mycode-cli = { workspace = true }

[dependency-groups]
dev = [
    "mycode-sdk",
    "mycode-cli",
    "basedpyright>=1.39.0",
    "hatchling>=1.27.0",
    "ruff>=0.15.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.basedpyright]
include = ["mycode/src", "cli/src", "tests", "scripts"]
exclude = [
    "**/__pycache__",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".uv-cache",
    "dist",
    "web",
]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "recommended"
baselineFile = ".basedpyright/baseline.json"
allowedUntypedLibraries = ["hatchling"]
reportMissingTypeStubs = false
reportAny = "none"
reportExplicitAny = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "hint"
reportUnusedFunction = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnreachable = "hint"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = "none"
reportPrivateUsage = "none"
reportUnknownLambdaType = "none"
reportUnusedParameter = "none"
reportUnusedVariable = "none"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["mycode", "mycode_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
