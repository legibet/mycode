<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#FBFDFE" />
    <script>
      try {
        const theme = localStorage.getItem("mycode_theme") || "system";
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isDark = theme === "dark" || (theme === "system" && prefersDark);

        if (isDark) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').content = "#0D1012";
        }
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon_slashes.svg" />
    <title>mycode</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
