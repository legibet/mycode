<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#15191F" />
  <script>
    try {
      const theme = localStorage.getItem('mycode_theme') || 'system'
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      const isLight = theme === 'light' || (theme === 'system' && !prefersDark)

      if (isLight) {
        document.documentElement.classList.add('light')
        document.querySelector('meta[name="theme-color"]').content = '#FBFCFE'
      }
    } catch { }
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon_slashes.svg" />
  <title>mycode</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
