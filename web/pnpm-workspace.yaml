allowBuilds:
  esbuild: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Only check trust downgrades for versions published in the last 90 days;
# older versions (e.g. reselect@5.1.1 from 2024) predate provenance adoption.
trustPolicyIgnoreAfter: 129600
catalog:
  katex: ^0.19.0

overrides:
  # rehype-katex still requires katex ^0.16; keep a single katex so its HTML
  # matches the stylesheet imported from the direct dependency.
  katex: "catalog:"
