name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --locked --dev

      - name: Lint Python
        run: uv run ruff check .

      - name: Typecheck Python
        run: uv run basedpyright

      - name: Run Python tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir web check

      - name: Typecheck
        run: pnpm --dir web typecheck

      - name: Test
        run: pnpm --dir web test

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Python
        run: uv python install 3.12

      - name: Build packages
        run: |
          rm -rf dist
          uv build --package mycode-sdk --no-sources
          uv build --package mycode-cli --no-sources

      - name: Verify wheel imports
        run: |
          sdk_wheel="$(echo dist/mycode_sdk-*.whl)"
          cli_wheel="$(echo dist/mycode_cli-*.whl)"
          uv run --isolated --no-project \
            --with "$sdk_wheel" \
            --with "$cli_wheel" \
            -- python -c "import mycode, mycode_cli"
