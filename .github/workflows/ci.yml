name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --locked --dev

      - name: Lint Python
        run: uv run ruff check .

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Typecheck Python
        run: uv run ty check

      - name: Run Python tests
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: web
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm --dir web check

      - name: Typecheck
        run: pnpm --dir web typecheck

      - name: Test
        run: pnpm --dir web test

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: web
          runtime: node@24
          cache: true
          install: false

      - name: Install Python
        run: uv python install 3.12

      - name: Build packages
        run: |
          rm -rf dist
          uv build --package mycode-sdk --no-sources
          uv build --package mycode-cli --no-sources

      - name: Verify wheel imports
        run: |
          sdk_wheel="$(echo dist/mycode_sdk-*.whl)"
          cli_wheel="$(echo dist/mycode_cli-*.whl)"
          uv run --isolated --no-project \
            --with "$sdk_wheel" \
            --with "$cli_wheel" \
            -- python -c "import mycode, mycode_cli"
