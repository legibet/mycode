name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Python
        run: uv python install 3.12

      - name: Build packages
        run: |
          rm -rf dist
          uv build --package mycode-sdk --no-sources
          uv build --package mycode-cli --no-sources

      - name: Verify wheel imports
        run: |
          sdk_wheel="$(echo dist/mycode_sdk-*.whl)"
          cli_wheel="$(echo dist/mycode_cli-*.whl)"
          uv run --isolated --no-project \
            --with "$sdk_wheel" \
            --with "$cli_wheel" \
            -- python -c "import mycode, mycode_cli"

      - name: Publish to PyPI
        run: uv publish
