name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: web
          runtime: node@24
          install: false

      - name: Install Python
        run: uv python install 3.12

      - name: Build packages
        run: |
          rm -rf dist
          uv build --package mycode-sdk --no-sources
          uv build --package mycode-cli --no-sources

      - name: Verify wheel imports
        run: |
          sdk_wheel="$(echo dist/mycode_sdk-*.whl)"
          cli_wheel="$(echo dist/mycode_cli-*.whl)"
          uv run --isolated --no-project \
            --with "$sdk_wheel" \
            --with "$cli_wheel" \
            -- python -c "import mycode, mycode_cli"

      - name: Publish to PyPI
        run: uv publish
